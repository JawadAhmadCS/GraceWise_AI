<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users - Gracewise</title>
    <link rel="stylesheet" href="css/admin-sidebar.css">
    <link rel="stylesheet" href="css/all-users.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="js/auth.js" defer></script>
    <script src="js/config.js"></script>
</head>
<body>
    <!-- Mobile Menu Toggle -->
    <div class="mobile-menu-toggle">
        <i class="fas fa-bars"></i>
    </div>
    
    <!-- Mobile Overlay -->
    <div class="mobile-overlay"></div>
    
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <img src="assest/logo/main_logo.png" alt="Gracewise Logo">
        </div>
        <nav class="nav-menu">
            <a href="admin-dashboard.html" class="nav-item">
                <i class="fas fa-th-large"></i>
                <span>Dashboard</span>
            </a>
            <a href="all-users.html" class="nav-item active">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>
            <a href="admin-curriculum.html" class="nav-item">
                <i class="fas fa-book"></i>
                <span>Curriculum</span>
            </a>
            <a href="admin-quiz.html" class="nav-item">
                <i class="fas fa-question-circle"></i>
                <span>Quiz Management</span>
            </a>
            <a href="admin-settings.html" class="nav-item">
                <i class="fas fa-sliders-h"></i>
                <span>AI Settings</span>
            </a>
        </nav>

        <div class="sidebar-footer">

            <div class="user-section">
                <a href="#">
                    <i class="fas fa-cog"></i>
                    Settings</a>
                <a href="#" onclick="auth.logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout</a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="What do you want to learn">
            </div>
            <div class="header-right">
                <div class="avatar">
                    <i class="fas fa-user-circle" style="font-size: 32px; color: #b59c61;"></i>
                </div>
            </div>
        </header>

        <!-- Users Content -->
        <div class="dashboard-container">
            <div class="users-container">
                <div class="users-header">
                    <h1>All users</h1>
                    <div class="users-controls">
                        <div class="search-users">
                            <i class="fas fa-search"></i>
                            <input type="text" placeholder="Search">
                        </div>
                        <select class="sort-dropdown">
                            <option value="newest">Sort by: Newest</option>
                            <option value="oldest">Sort by: Oldest</option>
                            <option value="name_asc">Sort by: Name A-Z</option>
                            <option value="name_desc">Sort by: Name Z-A</option>
                        </select>
                    </div>
                </div>

                <table class="users-table">
                    <thead>
                        <tr>
                            <th>User Name</th>
                            <th>Email</th>
                            <th>Registered Date</th>
                            <th>Status</th>
                            <th>Subscription</th>
                            <th>Access</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr>
                            <td colspan="6" class="text-center">Loading users...</td>
                        </tr>
                    </tbody>
                </table>

                <div class="pagination">
                    <div class="pagination-info" id="pagination-info">
                        Loading...
                    </div>
                    <div class="pagination-controls" id="pagination-controls">
                        <!-- Pagination buttons will be generated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mobile menu functionality
        const mobileToggle = document.querySelector('.mobile-menu-toggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.mobile-overlay');
        const body = document.body;

        function toggleMobileMenu() {
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('active');
            body.classList.toggle('menu-open');
            
            // Toggle icon between bars and times
            const icon = mobileToggle.querySelector('i');
            if (sidebar.classList.contains('mobile-open')) {
                icon.className = 'fas fa-times';
            } else {
                icon.className = 'fas fa-bars';
            }
        }

        mobileToggle.addEventListener('click', toggleMobileMenu);
        overlay.addEventListener('click', toggleMobileMenu);
        
        // Update current date (if element exists)
        const currentDateEl = document.getElementById('current-date');
        if (currentDateEl) {
            currentDateEl.textContent = new Date().toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        // State variables
        let currentPage = 1;
        let totalPages = 1;
        let searchTerm = '';
        let sortBy = 'newest';
        const perPage = 10;

        // Format date
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        // Load users from API
        async function loadUsers(page = 1, search = '', sort = 'newest') {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    window.location.href = 'sign_in.html';
                    return;
                }

                const url = new URL(`${window.API_BASE_URL}/auth/all-users`);
                url.searchParams.append('page', page);
                url.searchParams.append('per_page', perPage);
                if (search) {
                    url.searchParams.append('search', search);
                }
                url.searchParams.append('sort_by', sort);

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem('access_token');
                        window.location.href = 'sign_in.html';
                        return;
                    }
                    throw new Error('Failed to fetch users');
                }

                const data = await response.json();
                displayUsers(data.users);
                updatePagination(data.page, data.total_pages, data.total);
                currentPage = data.page;
                totalPages = data.total_pages;

            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('users-table-body').innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 20px; color: #dc2626;">
                            Failed to load users. Please try again.
                        </td>
                    </tr>
                `;
            }
        }

        // Display users in table
        function displayUsers(users) {
            const tbody = document.getElementById('users-table-body');
            const planNames = {
                free: 'Free',
                plan: 'Plan',
                thrive: 'Thrive',
                together: 'Together'
            };

            function getSubscriptionStatusLabel(rawStatus) {
                const status = (rawStatus || 'inactive').toLowerCase();
                if (status === 'active') return 'Active';
                if (status === 'trialing') return 'Trialing';
                if (status === 'past_due') return 'Past due';
                if (status === 'canceled') return 'Canceled';
                return 'Inactive';
            }
            
            if (users.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 20px;">
                            No users found.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td class="user-name">${user.first_name || ''} ${user.last_name || ''}</td>
                    <td>${user.email}</td>
                    <td>${formatDate(user.created_at)}</td>
                    <td>
                        <span class="status-badge ${user.is_active ? 'status-active' : 'status-inactive'}">
                            ${user.is_active ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td>
                        <div class="subscription-cell">
                            <span class="tier-badge tier-${(user.effective_tier || 'free').toLowerCase()}">
                                ${planNames[(user.effective_tier || 'free').toLowerCase()] || 'Free'}
                            </span>
                            <span class="subscription-status">
                                ${getSubscriptionStatusLabel(user.subscription_status)}
                            </span>
                        </div>
                    </td>
                    <td>
                        <div class="access-actions">
                            <button onclick="toggleUserActive(${user.id}, ${user.is_active ? 'false' : 'true'})">
                                ${user.is_active ? 'Deactivate' : 'Activate'}
                            </button>
                            <button onclick="toggleUserAdmin(${user.id}, ${user.is_admin ? 'false' : 'true'})">
                                ${user.is_admin ? 'Remove Admin' : 'Make Admin'}
                            </button>
                            <div class="plan-grant-controls">
                                <select id="plan-select-${user.id}" class="plan-select">
                                    <option value="plan">Plan</option>
                                    <option value="thrive">Thrive</option>
                                    <option value="together">Together</option>
                                </select>
                                <button class="grant-plan-btn" onclick="grantFreePlan(${user.id})">
                                    Grant Free Plan
                                </button>
                            </div>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function toggleUserActive(userId, isActive) {
            await updateUserAccess(userId, { is_active: isActive });
        }

        async function toggleUserAdmin(userId, isAdmin) {
            await updateUserAccess(userId, { is_admin: isAdmin });
        }

        async function grantFreePlan(userId) {
            const planSelect = document.getElementById(`plan-select-${userId}`);
            const selectedPlan = (planSelect?.value || '').toLowerCase();

            if (!selectedPlan) {
                alert('Please select a plan first.');
                return;
            }

            const confirmed = window.confirm(`Activate ${selectedPlan} access for this user for free?`);
            if (!confirmed) return;

            await updateUserAccess(userId, { free_plan_tier: selectedPlan });
        }

        async function updateUserAccess(userId, payload) {
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch(`${window.API_BASE_URL}/auth/admin/users/${userId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Update failed');
                }

                loadUsers(currentPage, searchTerm, sortBy);
            } catch (error) {
                alert(error.message || 'Failed to update user access');
            }
        }

        // Update pagination info and controls
        function updatePagination(page, totalPagesCount, totalCount) {
            const start = (page - 1) * perPage + 1;
            const end = Math.min(page * perPage, totalCount);
            
            document.getElementById('pagination-info').textContent = 
                `Showing data ${start} to ${end} of ${totalCount} entries`;

            const paginationControls = document.getElementById('pagination-controls');
            let html = '';

            // Previous button
            html += `<button class="pagination-btn" ${page === 1 ? 'disabled' : ''} onclick="changePage(${page - 1})">
                <i class="fas fa-chevron-left"></i>
            </button>`;

            // Page numbers
            const maxButtons = 5;
            let startPage = Math.max(1, page - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPagesCount, startPage + maxButtons - 1);
            
            if (endPage - startPage < maxButtons - 1) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }

            if (startPage > 1) {
                html += `<button class="pagination-btn" onclick="changePage(1)">1</button>`;
                if (startPage > 2) {
                    html += `<span>...</span>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="pagination-btn ${i === page ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            if (endPage < totalPagesCount) {
                if (endPage < totalPagesCount - 1) {
                    html += `<span>...</span>`;
                }
                html += `<button class="pagination-btn" onclick="changePage(${totalPagesCount})">${totalPagesCount}</button>`;
            }

            // Next button
            html += `<button class="pagination-btn" ${page === totalPagesCount ? 'disabled' : ''} onclick="changePage(${page + 1})">
                <i class="fas fa-chevron-right"></i>
            </button>`;

            paginationControls.innerHTML = html;
        }

        // Change page
        function changePage(page) {
            if (page >= 1 && page <= totalPages) {
                loadUsers(page, searchTerm, sortBy);
            }
        }

        // Search functionality
        let searchTimeout;
        document.querySelector('.search-users input').addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            searchTerm = e.target.value;
            searchTimeout = setTimeout(() => {
                currentPage = 1;
                loadUsers(1, searchTerm, sortBy);
            }, 500);
        });

        // Sort functionality
        document.querySelector('.sort-dropdown').addEventListener('change', function(e) {
            sortBy = e.target.value;
            currentPage = 1;
            loadUsers(1, searchTerm, sortBy);
        });

        // Initial load
        loadUsers();
    </script>
</body>
</html>
